html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.42 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

button { min-height: 50px; border: 0; border-radius: 11px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }

      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  // Dokument sa dá prepísať až po jeho dočítaní, inak by sa aplikácia pridala k tejto obrazovke.
  function show(html) {
    var run = function () { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); };
    if (document.readyState === 'complete') run(); else window.addEventListener('load', run);
  }
  function ask() { $('wait').hidden = true; $('form').hidden = false; }
  // Kód tvoria iba číslice, medzery a iné znaky nevadia.
  function clean(v) { return v.replace(/\D/g, ''); }
  if (!window.crypto || !crypto.subtle) { $('wait').textContent = 'Tento prehliadač nevie aplikáciu otvoriť. Aktualizuj iOS alebo otvor stránku v Safari.'; return; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { }
  if (saved) decrypt(bytes(saved)).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (e) { } ask(); });
  else ask();
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = clean($('code').value), go = $('go');
    if (!code) return;
    go.disabled = true; go.textContent = 'Otváram…'; $('msg').textContent = '';
    var raw;
    derive(code).then(function (r) { raw = r; return decrypt(r); }).then(function (html) {
      try { localStorage.setItem(KEY, text(raw)); } catch (e) { }
      show(html);
    }).catch(function (err) {
      go.disabled = false; go.textContent = 'Otvoriť';
      // Pri zlom kóde hlási šifrovanie OperationError. Všetko ostatné je iná chyba a treba ju vidieť.
      $('msg').textContent = err && err.name === 'OperationError' ? 'Kód nesedí. Skontroluj ho a skús to znova.' : 'Stránka sa nedá otvoriť. Pošli snímku tejto správy: ' + (err && err.name) + ' ' + (err && err.message) + ' · ' + navigator.userAgent.slice(13, 70);
    });
  });
})();
</script>
